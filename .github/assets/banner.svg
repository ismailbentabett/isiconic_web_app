<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="isiconic banner">
  <defs>
    <clipPath id="clip"><rect width="1280" height="400" rx="24"/></clipPath>

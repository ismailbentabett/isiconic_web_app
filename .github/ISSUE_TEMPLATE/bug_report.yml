name: Bug report
description: Report something that is broken or behaves unexpectedly in isiconic.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/ismailbentabett/isiconic_web_app/issues) first.
        **Security vulnerabilities must not be reported here.** See [SECURITY.md](https://github.com/ismailbentabett/isiconic_web_app/blob/HEAD/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected area
      options:
        - Server / API (Express)
        - Data models (MongoDB / Mongoose)
        - Auth
        - Stores & products
        - Cart
        - Feed, posts & stories
        - Chat (Socket.IO)
        - Image uploads (GridFS)
        - Client (Vue / Vuetify)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, stack traces or screenshots if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output. Remove secrets and personal data first.
      render: shell
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "16.x"
  - type: input
    id: mongodb
    attributes:
      label: MongoDB version or provider
      placeholder: "MongoDB 5.0 / Atlas"
  - type: input
    id: os
    attributes:
      label: Operating system and browser
      placeholder: "Windows 11, Chrome 120"
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed any secrets, tokens or personal data from this report.
          required: true

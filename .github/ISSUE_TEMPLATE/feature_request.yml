name: Feature request
description: Suggest an idea or improvement for isiconic.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please check the [roadmap](https://github.com/ismailbentabett/isiconic_web_app#-roadmap) and [existing issues](https://github.com/ismailbentabett/isiconic_web_app/issues) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is it for?
      placeholder: As a user, I want to ... so that ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Server / API (Express)
        - Data models (MongoDB / Mongoose)
        - Auth
        - Stores & products
        - Cart
        - Feed, posts & stories
        - Chat (Socket.IO)
        - Image uploads (GridFS)
        - Client (Vue / Vuetify)
        - Documentation
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this and open a pull request.
